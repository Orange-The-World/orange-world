name: CI

on:
  pull_request:
    branches: [dev, prod]
  push:
    branches: [dev, prod]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-build:
    name: Lint + build portal
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Setup Node 24 (for Vite crypto.hash)
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Install dependencies
        run: cd sites/world && bun install --frozen-lockfile

      - name: Lint
        run: cd sites/world && bun run lint
        continue-on-error: true

      - name: Build
        run: cd sites/world && bun run build
