name: CI

on:
  pull_request:
    branches: [dev, prod]
  push:
    branches: [dev, prod]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-build:
    name: Lint + build portal
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Setup Node 24 (for Vite crypto.hash)
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Install dependencies
        run: cd sites/world && bun install --frozen-lockfile

      - name: Lint
        run: cd sites/world && bun run lint
        continue-on-error: true

      - name: Build
        run: cd sites/world && bun run build

  export-tests:
    name: Export unit tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      # scripts/export holds the two guards that stand between the database and
      # a published CC-BY dataset: the coverage guard and the byte-for-byte
      # writer check. They run in the nightly refresh job too, deliberately, but
      # a pull request that changes them must not be reviewed against checks
      # that never executed them.
      - name: Run the export unit tests
        run: bun run test:data

  export-typecheck:
    name: Typecheck export scripts
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0

      - name: Install dependencies
        run: bun install

      # fetchAllRows in scripts/export/lib/client.ts takes a required unique
      # tiebreaker column, because paging on a non-unique sort key can return
      # one row twice and another never. Nothing here compiled scripts/export
      # before this job, so a caller that omitted it failed at RUNTIME in the
      # nightly refresh rather than on the pull request. This is what turns
      # that contract back into a compile time one.
      - name: Typecheck scripts/export
        run: |
          set -o pipefail
          rc=0
          bun run typecheck:data 2>&1 | tee typecheck.log || rc=$?
          {
            if [ "$rc" -eq 0 ]; then
              echo "### Typecheck export scripts: PASSED"
            else
              echo "### Typecheck export scripts: FAILED (exit $rc)"
            fi
            echo
            echo '```'
            cat typecheck.log
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "$rc" -ne 0 ]; then
            grep -E "error TS[0-9]+" typecheck.log | head -20 | while IFS= read -r line; do
              echo "::error::$line"
            done
          fi
          exit "$rc"
