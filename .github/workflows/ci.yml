name: CI

on:
  pull_request:
    branches: [dev, prod]
  push:
    branches: [dev, prod]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-build:
    name: Lint + build portal
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Setup Node 24 (for Vite crypto.hash)
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Install dependencies
        run: cd sites/world && bun install --frozen-lockfile

      - name: Lint
        run: cd sites/world && bun run lint
        continue-on-error: true

      - name: Build
        run: cd sites/world && bun run build

  export-tests:
    name: Export unit tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      # scripts/export holds the two guards that stand between the database and
      # a published CC-BY dataset: the coverage guard and the byte-for-byte
      # writer check. They run in the nightly refresh job too, deliberately, but
      # a pull request that changes them must not be reviewed against checks
      # that never executed them.
      - name: Run the export unit tests
        run: bun run test:data

  typecheck-export:
    name: Typecheck scripts/export
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          # Pinned for the same reason as the other jobs in this file: a
          # floating toolchain makes a red or green result unattributable.
          bun-version: 1.4.0

      - name: Install dependencies
        run: bun install

      # fetchAllRows in scripts/export/lib/client.ts takes a REQUIRED
      # uniqueColumn tiebreaker, so a new caller cannot page on a non-unique
      # key without deciding to. That is a compile time rule, and until this
      # job existed nothing in this repository compiled scripts/export: no tsc
      # invocation, no typecheck script, and lint covering only the portal. A
      # caller that omitted the argument was therefore caught at RUNTIME, in
      # the nightly refresh, rather than on the pull request that introduced it.
      - name: Typecheck scripts/export
        run: |
          set -uo pipefail
          if bun run typecheck:data > /tmp/tsc.log 2>&1; then
            cat /tmp/tsc.log
            echo "typecheck clean: scripts/export compiles"
            exit 0
          fi
          cat /tmp/tsc.log
          # Also emit each diagnostic as an annotation. The job log is not
          # visible on the pull request itself, so without this a reviewer sees
          # a red check with no reason attached to it.
          while IFS= read -r line; do
            case "$line" in
              *"error TS"*) echo "::error::${line}" ;;
            esac
          done < /tmp/tsc.log
          echo "::error::typecheck failed for scripts/export"
          exit 1
