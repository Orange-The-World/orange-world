name: CI

on:
  # No branches: filter here, deliberately. Filtering pull_request by BASE
  # branch means a pull request stacked on a feature branch runs no job at all
  # and still reads green, which is indistinguishable from passing. Every pull
  # request gets checked, whatever it targets.
  pull_request:
  # push stays filtered: we build dev and prod, not every feature branch push.
  push:
    branches: [dev, prod]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-build:
    name: Lint + build portal
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          # Pinned, not `latest` (OR-T1525). With `latest`, two runs of a
          # byte-identical tree can execute on two different Bun builds, so a
          # job that goes green and then red tells you nothing about the tree.
          # Bump this deliberately, in its own PR.
          bun-version: 1.4.0

      - name: Setup Node 24 (for Vite crypto.hash)
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Install workspace dependencies
        # The guard tests below need no database and no credentials, but they
        # DO need node_modules: client.test.ts imports lib/client.ts, which
        # imports @supabase/supabase-js. Without this step that import cannot
        # resolve and the whole test step exits 1, which is what turned this
        # required check red on dev. The "Export unit tests" job runs the same
        # command after this same install, which is why the identical tests
        # passed there and failed here. If you remove this, read that job
        # first.
        #
        # Frozen, and it has to stay frozen. This is the first install in the
        # job. A plain `bun install` here would re-resolve and silently
        # rewrite an out-of-date bun.lock inside the CI workspace, and the
        # frozen install further down would then pass against the rewritten
        # file. Frozen means a lockfile that disagrees with package.json fails
        # here, at the first install, instead of being repaired where nobody
        # can see it.
        run: |
          set -o pipefail
          rc=0
          bun install --frozen-lockfile 2>&1 | tee install.log || rc=$?
          if [ "$rc" -ne 0 ]; then
            head -10 install.log | while IFS= read -r line; do
              echo "::error::bun install --frozen-lockfile: $line"
            done
          fi
          exit "$rc"

      - name: Guard logic unit tests
        # Pure fixtures, no database, no credentials: guard.ts, lib/age.ts and
        # lib/client.ts are exercised directly against fakes.
        run: bun test scripts/export

      - name: Install dependencies
        run: cd sites/world && bun install --frozen-lockfile

      - name: Lint
        run: cd sites/world && bun run lint
        continue-on-error: true

      - name: Build
        run: cd sites/world && bun run build

  export-tests:
    name: Export unit tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          # Pinned for the same reason as the job above, and it matters more
          # here: OR-T1513 saw this job go red and then green on the same tree
          # minutes apart. The five-green-runs flake control cannot measure the
          # tests until the toolchain underneath them stops moving.
          bun-version: 1.4.0

      # Frozen. bun.lock at the repository root is the pin for the whole
      # workspace: sites/world is a workspace member, so there is one lockfile
      # and not one per directory. With --frozen-lockfile an install fails when
      # package.json and bun.lock disagree, instead of resolving ranges fresh
      # and rewriting the lockfile inside the CI workspace, so two builds of
      # the same commit install the same dependency versions. To change a
      # dependency, regenerate bun.lock with the Bun version pinned in this
      # file (the Refresh lockfile workflow does that on CI) and commit it
      # alongside the package.json change.
      - name: Install dependencies
        run: bun install --frozen-lockfile

      # scripts/export holds the two guards that stand between the database and
      # a published CC-BY dataset: the coverage guard and the byte-for-byte
      # writer check. They run in the nightly refresh job too, deliberately, but
      # a pull request that changes them must not be reviewed against checks
      # that never executed them.
      - name: Run the export unit tests
        run: bun run test:data

  export-typecheck:
    name: Typecheck export scripts
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0

      # Frozen, as in the jobs above: an install that cannot be reproduced from
      # bun.lock must fail rather than resolve fresh.
      - name: Install dependencies
        run: bun install --frozen-lockfile

      # fetchAllRows in scripts/export/lib/client.ts takes a required unique
      # tiebreaker column, because paging on a non-unique sort key can return
      # one row twice and another never. Nothing here compiled scripts/export
      # before this job, so a caller that omitted it failed at RUNTIME in the
      # nightly refresh rather than on the pull request. This is what turns
      # that contract back into a compile time one.
      #
      # The test files are IN scope (OR-T1726): the tests drive the exporters
      # through a fake client, and a fake that drifts from the real client's
      # shape keeps the suite green while the call it stands in for no longer
      # compiles. That is the same failure this job exists to close, one level
      # up.
      - name: Typecheck scripts/export
        run: |
          set -o pipefail
          rc=0
          bun run typecheck:data 2>&1 | tee typecheck.log || rc=$?
          {
            if [ "$rc" -eq 0 ]; then
              echo "### Typecheck export scripts: PASSED"
            else
              echo "### Typecheck export scripts: FAILED (exit $rc)"
            fi
            echo
            echo '```'
            cat typecheck.log
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "$rc" -ne 0 ]; then
            grep -E "error TS[0-9]+" typecheck.log | head -20 | while IFS= read -r line; do
              echo "::error::$line"
            done || true
          fi
          exit "$rc"
