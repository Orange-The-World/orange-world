name: CI

on:
  pull_request:
    branches: [dev, prod]
  push:
    branches: [dev, prod]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-build:
    name: Lint + build portal
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Setup Node 24 (for Vite crypto.hash)
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Install dependencies
        run: cd sites/world && bun install --frozen-lockfile

      - name: Lint
        run: cd sites/world && bun run lint
        continue-on-error: true

      - name: Build
        run: cd sites/world && bun run build

  export-tests:
    name: Export unit tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      # scripts/export holds the two guards that stand between the database and
      # a published CC-BY dataset: the coverage guard and the byte-for-byte
      # writer check. They run in the nightly refresh job too, deliberately, but
      # a pull request that changes them must not be reviewed against checks
      # that never executed them.
      - name: Run the export unit tests
        run: bun run test:data

  export-typecheck:
    name: Typecheck export scripts
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      # The property this protects: fetchAllRows takes a REQUIRED uniqueColumn
      # argument, because paging on a non unique sort key can skip or duplicate
      # a row at a page boundary and that row lands in a published dataset.
      # Required is a compile time rule and nothing here compiled scripts/export
      # before this job existed, so an omitted tiebreaker was caught at runtime
      # in the nightly refresh, not on the pull request that introduced it.
      #
      # Proven by watching it fail, not by watching it pass: a caller was edited
      # to drop the argument, this job went red with TS2554, and the edit was
      # reverted. A typecheck nobody has seen go red is not evidence of anything.
      - name: Typecheck scripts/export
        run: bun run typecheck:data
