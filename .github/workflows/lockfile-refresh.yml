name: Refresh lockfiles

# OR-T1734. This repository has no committed lockfile, so every install
# resolves version ranges fresh and two builds of the same commit can install
# different dependency versions. The lint job already runs
# `bun install --frozen-lockfile` and is green, which means that flag currently
# enforces nothing and reads as a pin that is not there.
#
# A bun.lock cannot be hand-written. It is generated by running bun install,
# and no always-on seat in this org has a shell, so the generation has to
# happen on a machine that runs bun. That is this workflow.
#
# WHAT IT DOES NOT DO: it does not write to dev, it does not open a pull
# request, and it does not change any install command. It puts the generated
# lockfiles on a branch. They land in dev through an ordinary reviewed pull
# request, because the first committed pin should be one somebody looked at in
# a diff.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  refresh:
    name: Generate both lockfiles and commit them to a branch
    runs-on: ubuntu-latest
    permissions:
      # Declared HERE, at job level, on a workflow that runs on
      # workflow_dispatch and nothing else. No pull_request run, from a fork or
      # otherwise, can reach this token. A fork cannot dispatch a workflow at
      # all: dispatching requires write access on a branch of this repository.
      # The branch and the two paths written below are literals in this file
      # rather than inputs, so a dispatcher cannot redirect the write.
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          # The same pin as ci.yml, and for the same reason (OR-T1525): with
          # `latest`, two runs of a byte-identical tree can execute on two
          # different Bun builds. A lockfile generated by a moving toolchain is
          # not a pin, it is a snapshot of whichever Bun happened to run.
          bun-version: 1.4.0

      - name: Setup Node 24
        uses: actions/setup-node@v6
        with:
          node-version: 24

      # TWO package roots, not one. The repository root and sites/world each
      # have their own package.json, so each needs its own lockfile. A change
      # that produces one of them has covered half the problem and will look
      # finished.
      - name: Install at the repository root
        run: bun install --save-text-lockfile

      - name: Install in sites/world
        run: cd sites/world && bun install --save-text-lockfile

      # Assert the work happened, not that the steps finished. An install that
      # produced no lockfile, or an empty one, must stop the run here rather
      # than commit a file that would then be trusted as a pin.
      - name: Both lockfiles exist and are not empty
        run: |
          set -uo pipefail
          STATUS=0
          for f in bun.lock sites/world/bun.lock; do
            if [ ! -f "${f}" ]; then
              echo "::error::${f} was not generated. If Bun wrote a binary bun.lockb instead, the fix is the text lockfile flag, not committing a binary file: a lockfile nobody can read in a diff cannot be reviewed, and reviewing the first pin is the point."
              STATUS=4
            elif [ ! -s "${f}" ]; then
              echo "::error::${f} is empty. An empty lockfile pins nothing and would be worse than none, because the frozen install would then pass against it."
              STATUS=4
            else
              echo "${f}: $(wc -l < "${f}") lines"
            fi
          done
          exit "${STATUS}"

      # Committed through the contents API rather than a git push, so the run
      # never holds a checkout of the target branch and cannot carry anything
      # else onto it. The only paths this job writes are the two named here.
      - name: Commit both lockfiles to the refresh branch
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -uo pipefail
          API="${GITHUB_API_URL:-https://api.github.com}"
          BRANCH='ops/lockfile-refresh'

          # Prints the HTTP status on stdout and leaves the body in resp.json.
          # The token is passed as a header and never echoed.
          req() {
            if [ -n "${3:-}" ]; then
              curl -sS -o resp.json -w '%{http_code}' -X "$1" \
                -H "authorization: Bearer ${GITHUB_TOKEN}" \
                -H 'accept: application/vnd.github+json' \
                --data @"$3" "$2"
            else
              curl -sS -o resp.json -w '%{http_code}' -X "$1" \
                -H "authorization: Bearer ${GITHUB_TOKEN}" \
                -H 'accept: application/vnd.github+json' "$2"
            fi
          }

          # Always base the branch on the commit this run was dispatched at.
          # A branch left over from an earlier run would otherwise carry a stale
          # tree into the review, and the diff would show changes nobody made in
          # this run.
          CODE=$(req GET "${API}/repos/${GITHUB_REPOSITORY}/git/ref/heads/${BRANCH}")
          if [ "${CODE}" = "404" ]; then
            printf '{"ref":"refs/heads/%s","sha":"%s"}' "${BRANCH}" "${GITHUB_SHA}" > ref.json
            CODE=$(req POST "${API}/repos/${GITHUB_REPOSITORY}/git/refs" ref.json)
            if [ "${CODE}" != "201" ]; then
              echo "::error::could not create ${BRANCH} (HTTP ${CODE}); nothing was committed. $(cat resp.json)"
              exit 3
            fi
          elif [ "${CODE}" = "200" ]; then
            printf '{"sha":"%s","force":true}' "${GITHUB_SHA}" > ref.json
            CODE=$(req PATCH "${API}/repos/${GITHUB_REPOSITORY}/git/refs/heads/${BRANCH}" ref.json)
            if [ "${CODE}" != "200" ]; then
              echo "::error::could not reset ${BRANCH} to ${GITHUB_SHA} (HTTP ${CODE}); nothing was committed. $(cat resp.json)"
              exit 3
            fi
          else
            echo "::error::could not read ${BRANCH} (HTTP ${CODE}); nothing was committed. This is 'I could not publish', not 'there was nothing to publish'. $(cat resp.json)"
            exit 3
          fi

          put_file() {
            TARGET="$1"
            SHA=''
            CODE=$(req GET "${API}/repos/${GITHUB_REPOSITORY}/contents/${TARGET}?ref=${BRANCH}")
            if [ "${CODE}" = "200" ]; then
              SHA=$(node -e 'process.stdout.write(JSON.parse(require("fs").readFileSync("resp.json","utf8")).sha)')
            elif [ "${CODE}" != "404" ]; then
              echo "::error::could not read ${TARGET} on ${BRANCH} (HTTP ${CODE}); it was NOT committed. $(cat resp.json)"
              return 3
            fi

            node -e '
              const fs = require("fs");
              const body = { message: process.argv[1], content: process.argv[2], branch: process.argv[3] };
              if (process.argv[4]) { body.sha = process.argv[4]; }
              fs.writeFileSync("put.json", JSON.stringify(body));
            ' "lockfile: regenerate ${TARGET} with bun 1.4.0 (run ${GITHUB_RUN_ID})" "$(base64 -w0 "${TARGET}")" "${BRANCH}" "${SHA}"

            CODE=$(req PUT "${API}/repos/${GITHUB_REPOSITORY}/contents/${TARGET}" put.json)
            if [ "${CODE}" != "200" ] && [ "${CODE}" != "201" ]; then
              echo "::error::could not write ${TARGET} on ${BRANCH} (HTTP ${CODE}); it was NOT committed. $(cat resp.json)"
              return 3
            fi
            echo "committed ${TARGET} to ${BRANCH} (HTTP ${CODE})"
            return 0
          }

          STATUS=0
          put_file bun.lock || STATUS=$?
          put_file sites/world/bun.lock || STATUS=$?
          # Both, or the branch carries half a pin and the frozen install would
          # fail on the root nobody committed.
          exit "${STATUS}"

      - name: Say what to do with them
        run: |
          {
            echo "## Both lockfiles are on \`ops/lockfile-refresh\`"
            echo ""
            echo "\`bun.lock\` (repository root) and \`sites/world/bun.lock\`, generated by"
            echo "Bun 1.4.0 on this run."
            echo ""
            echo "Next: open a pull request from \`ops/lockfile-refresh\` into \`dev\` and"
            echo "review the diff. This workflow does not open it, on purpose, because the"
            echo "first committed pin should be one somebody looked at."
            echo ""
            echo "After that lands, switch the export-tests job to a frozen install, rewrite"
            echo "the comment in \`ci.yml\` that explains why it was not frozen, and update the"
            echo "\`.gitignore\` note, so the repository stops saying there is no pin once"
            echo "there is one. Then tamper a lockfile on a throwaway branch and watch the"
            echo "frozen install go red, because a flag nobody has seen fail is the thing"
            echo "this replaces."
          } >> "$GITHUB_STEP_SUMMARY"
