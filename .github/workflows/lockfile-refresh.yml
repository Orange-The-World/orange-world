name: Refresh lockfile

# Why this exists (OR-T1734). ci.yml's lint-and-build job runs
# `bun install --frozen-lockfile` and is green on dev, while no lockfile is
# committed anywhere in this repository. A frozen install with nothing to
# freeze against enforces nothing: it reads as a dependency pin that does not
# exist. This is a public repository publishing a data site and the runtime
# dependency @supabase/supabase-js is a caret range, so two builds of the same
# commit can install different versions today.
#
# A lockfile cannot be hand written; it is whatever `bun install` produces. So
# the generating machine has to be one that runs bun, and that is CI. This
# workflow is that machine and nothing else: it installs, commits the lockfile
# it produced onto a dedicated branch, and stops. It does not open the pull
# request and it never writes to dev, so the lockfile still lands through a
# reviewed diff like any other change.
#
# Security shape, deliberately narrow:
#   - workflow_dispatch is the ONLY trigger, so no pull_request run, from a
#     fork or otherwise, can reach this file at all. Dispatching a workflow
#     requires write access on a branch of this repository, which a fork does
#     not have.
#   - The workflow-level permission block is read only. contents: write is
#     declared on the single job that commits, and nowhere else.
#   - The target branch and the committed paths are literals below, not
#     inputs, so whoever dispatches it cannot redirect the write.
#   - It commits through the contents API rather than a git push, so the run
#     never holds a checkout of the target branch and cannot carry anything
#     else onto it.

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: lockfile-refresh
  cancel-in-progress: false

jobs:
  refresh:
    name: Generate and commit the lockfile
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      TARGET_BRANCH: ops/lockfile-refresh
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          # The same pin ci.yml uses. The lockfile this run produces is the one
          # both CI install steps will later be validated against, so it must
          # be generated by the Bun build those steps run.
          bun-version: 1.4.0

      - name: Install at the repository root
        run: bun install

      - name: Install in sites/world
        # The root package.json declares "workspaces": ["sites/world"], so this
        # is one workspace and not two independent package roots. Whether that
        # yields one lockfile at the root or one per directory is NOT asserted
        # here: the next step reports what actually exists on disk after the
        # install and commits exactly that. This step runs because it is the
        # install line ci.yml's lint-and-build job uses.
        run: cd sites/world && bun install

      - name: Report which lockfiles the install produced
        id: collect
        run: |
          set -euo pipefail
          found=()
          for p in bun.lock bun.lockb sites/world/bun.lock sites/world/bun.lockb; do
            if [ -f "$p" ]; then
              printf 'FOUND  %s (%s bytes)\n' "$p" "$(wc -c < "$p")"
              found+=("$p")
            else
              printf 'absent %s\n' "$p"
            fi
          done
          # A run that produced nothing must not exit 0. This whole ticket
          # exists because a check that cannot fail reads as a guarantee.
          if [ ${#found[@]} -eq 0 ]; then
            echo "FAILED: bun install produced no lockfile at any known path." >&2
            echo "Either Bun stopped writing one, or the paths above are wrong." >&2
            exit 1
          fi
          printf 'files=%s\n' "${found[*]}" >> "$GITHUB_OUTPUT"

      - name: Commit them to the target branch
        env:
          FILES: ${{ steps.collect.outputs.files }}
        run: |
          set -euo pipefail
          read -r -a files <<< "$FILES"
          expected=${#files[@]}

          if ! gh api "repos/$REPO/git/ref/heads/$TARGET_BRANCH" >/dev/null 2>&1; then
            echo "Branch $TARGET_BRANCH does not exist yet, creating it at $GITHUB_SHA"
            gh api "repos/$REPO/git/refs" \
              -f ref="refs/heads/$TARGET_BRANCH" \
              -f sha="$GITHUB_SHA" >/dev/null
          fi

          committed=0
          for p in "${files[@]}"; do
            old=$(gh api "repos/$REPO/contents/$p?ref=$TARGET_BRANCH" --jq .sha 2>/dev/null || true)
            args=(-X PUT "repos/$REPO/contents/$p"
                  -f message="chore: refresh $p from a bun install on CI (OR-T1734)"
                  -f branch="$TARGET_BRANCH"
                  -f content="$(base64 -w0 "$p")")
            if [ -n "$old" ]; then
              args+=(-f sha="$old")
            fi
            gh api "${args[@]}" >/dev/null
            echo "COMMITTED $p to $TARGET_BRANCH"
            committed=$((committed + 1))
          done

          # Count what was done, not that the loop finished.
          if [ "$committed" -ne "$expected" ]; then
            echo "FAILED: found $expected lockfile(s) but committed $committed." >&2
            exit 1
          fi

          {
            echo "### Lockfile refresh (OR-T1734)"
            echo
            echo "Committed $committed of $expected lockfile(s) to \`$TARGET_BRANCH\`:"
            for p in "${files[@]}"; do
              echo "- \`$p\`"
            done
            echo
            echo "Open a pull request from \`$TARGET_BRANCH\` into \`dev\` to land them."
            echo "This workflow deliberately does not open it, so the lockfile is reviewed in a diff."
          } >> "$GITHUB_STEP_SUMMARY"
