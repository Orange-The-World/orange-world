name: Leak check
# Throwaway edit on the proof branch. Do not merge this branch.

on:
  # No branches: filter here, deliberately. Filtering pull_request by BASE
  # branch means a pull request stacked on a feature branch runs no leak scan
  # at all and still reads green, which is indistinguishable from a clean scan.
  # Every pull request gets scanned, whatever it targets.
  pull_request:
  # push stays filtered: we scan dev and prod, not every feature branch push.
  push:
    branches: [dev, prod]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pre-publish-scan:
    name: Pre-publish leak scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Run pre-publish leak scan
        # Fails the job (and the required check) if any leak is found.
        # See scripts/pre-publish-scan.sh for the rules and exemptions.
        run: bash scripts/pre-publish-scan.sh
