name: Cloudflare Pages deploy health (branch-aware)

# OR-T1349 / OR-T1347, 2026-09-02.
#
# See scripts/pages-deploy-health.sh for the root cause: orangerails-world's
# prod branch deployed daily until 2026-07-19T04:30 UTC then silently
# stopped, and nothing alerted because nothing watched the DECLARED branch's
# own history, only whatever the project's most recent deployment happened
# to be.
#
# REQUIRES two repo secrets that do not exist yet as of this PR:
#   CLOUDFLARE_API_TOKEN    (Pages:Read is enough)
#   CLOUDFLARE_ACCOUNT_ID
# Adding a secret is founder/CTO territory. Until both are set this workflow
# fails on every run naming the exact missing secret, deliberately: a silent
# skip would read exactly like a healthy check.

on:
  schedule:
    - cron: '12,42 * * * *'
  workflow_dispatch: {}

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Check orangerails-world (declared branch prod)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          chmod +x scripts/pages-deploy-health.sh
          ./scripts/pages-deploy-health.sh orangerails-world prod 30
